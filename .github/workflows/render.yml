name: Render Cinematic Docu

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Main Title (बड़ा टाइटल)'
        required: true
        default: "THE QUEEN'S DECEPTION"
      subtitle:
        description: 'Subtitle / Year (नीचे का टेक्स्ट)'
        required: true
        default: 'KASHMIR, 958 AD'

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux Video Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Auto-Install Remotion Engine
        run: |
          npm init -y
          npm install react@18.2.0 react-dom@18.2.0 remotion@4.0.200 @remotion/cli@4.0.200

      - name: Pre-check Headless Browser
        run: npx remotion browser ensure

      - name: Render 1080p Video
        env:
          INPUT_Props: ${{ toJSON(github.event.inputs) }}
        run: npx remotion render src/index.tsx DarkHistory out/video.mp4 --props="$INPUT_Props"

      - name: Save Video for Download
        uses: actions/upload-artifact@v4
        with:
          name: kashmir-docu-video
          path: out/video.mp4
          
