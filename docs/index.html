<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kashmir Docu Director Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #09090b; color: #f4f4f5; font-family: system-ui, sans-serif; overflow-x: hidden; }
    @keyframes kenburns { 0% { transform: scale(1.05); } 100% { transform: scale(1.25); } }
    @keyframes shake {
      0%, 100% { transform: scale(1.18) translate(0, 0); }
      20% { transform: scale(1.18) translate(-12px, 8px); }
      40% { transform: scale(1.18) translate(12px, -10px); }
      60% { transform: scale(1.18) translate(-10px, -6px); }
      80% { transform: scale(1.18) translate(10px, 10px); }
    }
    @keyframes slash {
      0% { width: 0%; opacity: 0; }
      20% { width: 140%; opacity: 1; }
      100% { width: 140%; opacity: 0; }
    }
    @keyframes thunder {
      0%, 100% { opacity: 0; }
      10%, 30% { opacity: 0.55; }
      20% { opacity: 0.1; }
    }
    .anim-zoom { animation: kenburns 5s ease-out forwards; }
    .anim-shake { animation: shake 0.35s infinite; }
    .sword-line {
      position: absolute; top: 50%; left: 50%; height: 8px;
      background: linear-gradient(90deg, transparent, #fff, #ff3300, #fff, transparent);
      box-shadow: 0 0 40px 12px rgba(255, 50, 0, 0.95);
      transform: translate(-50%, -50%) rotate(-25deg);
      animation: slash 0.6s ease-out forwards;
    }
    .thunder-flash { animation: thunder 1.2s ease-in-out infinite; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Header -->
  <header class="bg-zinc-900 border-b border-zinc-800 px-4 py-3 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded-full bg-red-600 animate-pulse"></span>
      <h1 class="font-black tracking-wider text-sm md:text-base uppercase">Kashmir Director Studio <span class="text-xs text-red-500 font-normal">LIVE 24/7</span></h1>
    </div>
    <button onclick="copyAndOpenActions()" class="bg-red-600 hover:bg-red-500 active:scale-95 transition text-white font-bold text-xs md:text-sm px-4 py-2 rounded-lg shadow-lg shadow-red-900/40">
      🚀 Copy & Render 1080p MP4
    </button>
  </header>

  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 p-4 max-w-7xl mx-auto w-full">
    
    <!-- LEFT / TOP: Live 16:9 Cinema Preview Player -->
    <div class="lg:col-span-7 flex flex-col gap-3">
      <div id="player-box" class="relative w-full aspect-video bg-black rounded-xl overflow-hidden border border-zinc-800 shadow-2xl">
        <!-- Background Image -->
        <img id="preview-img" src="" class="w-full h-full object-cover brightness-50 contrast-125 anim-zoom" />
        
        <!-- Dark Vignette & Letterbox -->
        <div class="absolute inset-0 bg-gradient-to-b from-black/80 via-transparent to-black/90 pointer-events-none"></div>
        <div class="absolute top-0 inset-x-0 h-6 md:h-10 bg-black z-20"></div>
        <div class="absolute bottom-0 inset-x-0 h-6 md:h-10 bg-black z-20"></div>

        <!-- FX Overlays -->
        <div id="fx-layer" class="absolute inset-0 pointer-events-none z-10"></div>

        <!-- Center Era & Title -->
        <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-6 z-10 pointer-events-none">
          <div id="preview-era" class="text-[10px] md:text-sm tracking-[0.35em] text-zinc-300 font-bold uppercase mb-1"></div>
          <h2 id="preview-title" class="text-2xl md:text-5xl font-black uppercase tracking-wider text-white"></h2>
        </div>

        <!-- Bottom Narration Subtitle -->
        <div class="absolute bottom-8 md:bottom-14 inset-x-0 flex justify-center px-4 z-20 pointer-events-none">
          <div id="preview-sub-box" class="bg-black/85 border-t-2 border-b-2 px-4 py-2 max-w-[90%] shadow-2xl">
            <p id="preview-sub" class="text-xs md:text-base text-zinc-100 text-center font-medium"></p>
          </div>
        </div>
      </div>

      <!-- Timeline & Player Controls -->
      <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-3 flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <button onclick="togglePlay()" id="play-btn" class="bg-zinc-100 text-black font-bold px-4 py-1.5 rounded-lg text-sm active:scale-95">▶ Play All</button>
            <button onclick="triggerSlashFX()" class="bg-zinc-800 hover:bg-zinc-700 text-xs px-3 py-1.5 rounded-lg border border-zinc-700">⚔️ Test Sword Slash</button>
          </div>
          <span id="scene-counter" class="text-xs text-zinc-400 font-mono">Scene 1 of 3</span>
        </div>

        <!-- Multi-Scene Timeline Bars (KineMaster Style) -->
        <div id="timeline-tracks" class="flex gap-1.5 overflow-x-auto pb-1"></div>
      </div>

      <!-- Paste AI Code Box -->
      <div class="bg-zinc-900/90 border border-red-900/50 rounded-xl p-3">
        <div class="flex items-center justify-between mb-1.5">
          <label class="text-xs font-bold text-red-400 uppercase tracking-wider">⚡ Paste AI Scene Code (JSON) Here:</label>
          <button onclick="applyPastedCode()" class="bg-red-600/20 border border-red-500/40 text-red-300 text-xs px-3 py-1 rounded hover:bg-red-600/30">Apply to Timeline</button>
        </div>
        <textarea id="json-box" rows="3" class="w-full bg-black/70 border border-zinc-800 rounded-lg p-2 text-xs font-mono text-green-400 focus:outline-none focus:border-red-500" placeholder="Paste JSON code from AI here..."></textarea>
      </div>
    </div>

    <!-- RIGHT / BOTTOM: Visual Scene Controls -->
    <div class="lg:col-span-5 bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex flex-col gap-3 h-fit">
      <div class="flex items-center justify-between border-b border-zinc-800 pb-2">
        <h3 class="font-bold text-sm uppercase tracking-wider text-zinc-300">🎛️ Edit Selected Scene</h3>
        <div class="flex gap-1.5">
          <button onclick="addNewScene()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-2.5 py-1 rounded">+ Add Scene</button>
          <button onclick="deleteCurrentScene()" class="bg-zinc-800 hover:bg-red-900 text-zinc-300 text-xs px-2.5 py-1 rounded">🗑️ Delete</button>
        </div>
      </div>

      <div class="flex flex-col gap-2.5 text-xs">
        <div>
          <label class="text-zinc-400 block mb-1">Era / Location (Top Text)</label>
          <input id="inp-era" oninput="updateCurrentScene()" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-white" />
        </div>
        <div>
          <label class="text-zinc-400 block mb-1">Main Heading (Big Title)</label>
          <input id="inp-title" oninput="updateCurrentScene()" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-white font-bold" />
        </div>
        <div>
          <label class="text-zinc-400 block mb-1">Bottom Subtitle / Narration</label>
          <textarea id="inp-sub" rows="2" oninput="updateCurrentScene()" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-white"></textarea>
        </div>
        <div>
          <label class="text-zinc-400 block mb-1">Background Image URL (4K Photo Link)</label>
          <input id="inp-img" oninput="updateCurrentScene()" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-zinc-300 font-mono text-[11px]" />
        </div>
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="text-zinc-400 block mb-1">Action Effect</label>
            <select id="inp-fx" onchange="updateCurrentScene()" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-2 py-2 text-white">
              <option value="sword-clash">⚔️ Sword Clash</option>
              <option value="blood-thunder">⚡ Blood Thunder</option>
              <option value="war-earthquake">🌋 War Quake</option>
              <option value="slow-push">🎥 Slow Push</option>
            </select>
          </div>
          <div>
            <label class="text-zinc-400 block mb-1">Duration (Sec)</label>
            <input id="inp-dur" type="number" min="2" max="20" oninput="updateCurrentScene()" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-white" />
          </div>
          <div>
            <label class="text-zinc-400 block mb-1">Glow Color</label>
            <input id="inp-color" type="color" oninput="updateCurrentScene()" class="w-full h-9 bg-zinc-950 border border-zinc-800 rounded-lg cursor-pointer" />
          </div>
        </div>
      </div>
    </div>

  </main>
    <!-- Apni docs/index.html mein <script> se </script> tak ki jagah yeh paste kar do -->
<script>
  let scenes = [];
  let activeIndex = 0;
  let isPlaying = false;
  let playTimer = null;
  let animFrame = 0;

  // Default Medieval Boat & Carpet JSON (with # comments support)
  const DEFAULT_RAW_JSON = `# PART 1: RIVER BOAT APPROACH
[
  {
    "partId": "PART_1_RIVER_APPROACH",
    "sceneType": "medieval-river-boat",
    "era": "JHELUM RIVER • 958 AD",
    "title": "ENVOYS OF THE NORTH",
    "subtitle": "Gahre paani aur kohre ko cheerte hue, shahi naav Qile ki deewaron ki taraf badh rahi thi...",
    "imageUrl": "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1920&q=85",
    "durationSec": 5,
    "fxType": "slow-push",
    "themeColor": "#f59e0b"
  },
# PART 2: FORTRESS GATE WELCOME
  {
    "partId": "PART_2_FORT_GATES",
    "sceneType": "medieval-fort-gate",
    "era": "LOHARA FORTRESS • MIDNIGHT",
    "title": "THE TORCHES OF LOHARA",
    "subtitle": "Qile ke burj par mashalein jal uthin aur bhari lakdi ke darwaze mehmaano ke liye khul gaye.",
    "imageUrl": "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=1920&q=85",
    "durationSec": 5,
    "fxType": "blood-thunder",
    "themeColor": "#ea580c"
  },
# PART 3: ROYAL CARPET PRESENTATION
  {
    "partId": "PART_3_CARPET_WELCOME",
    "sceneType": "medieval-courtyard-welcome",
    "era": "THE ROYAL DARBAR • 958 AD",
    "title": "THE CRIMSON TRIBUTE",
    "subtitle": "Mehmaano ne sone ke dhagon se buna shahi qaleen pesh kiya, aur darbar ne jhuk kar swagat kiya.",
    "imageUrl": "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=1920&q=85",
    "durationSec": 6,
    "fxType": "sword-clash",
    "themeColor": "#dc2626"
  }
]`;

  // Strips '#' comments so partitioned JSON works seamlessly
  function parseCommentedJSON(rawText) {
    const cleanLines = rawText
      .split('\n')
      .filter(line => !line.trim().startsWith('#'))
      .join('\n');
    return JSON.parse(cleanLines);
  }

  // Draws Live Animated SVG Boat, River, Fort & Royal Carpet inside #fx-layer
  function renderLiveVectorAnimation() {
    animFrame++;
    const s = scenes[activeIndex];
    if (!s) return;
    const fxLayer = document.getElementById('fx-layer');
    if (!fxLayer) return;

    const boatX = ((animFrame * 1.6) % 520) - 80;
    const boatBob = Math.sin(animFrame * 0.12) * 5;
    const oarAngle = Math.sin(animFrame * 0.2) * 25;
    const bowAngle = Math.sin(animFrame * 0.08) * 10 - 10;
    const carpetLen = 55 + Math.abs(Math.sin(animFrame * 0.05)) * 65;

    if (s.sceneType === 'medieval-river-boat' || activeIndex === 0) {
      fxLayer.innerHTML = `
        <svg viewBox="0 0 800 450" class="w-full h-full">
          <!-- Distant Medieval Fort with Glowing Gate -->
          <g transform="translate(540, 110)">
            <rect x="20" y="50" width="180" height="120" fill="#090d16" stroke="#1e293b"/>
            <rect x="0" y="20" width="45" height="150" fill="#06090f"/>
            <rect x="175" y="15" width="50" height="155" fill="#06090f"/>
            <path d="M 85 170 L 85 115 Q 110 90 135 115 L 135 170 Z" fill="#f59e0b" opacity="0.85"/>
          </g>
          <!-- Animated River Waves -->
          <rect x="0" y="275" width="800" height="175" fill="rgba(7, 17, 30, 0.78)"/>
          <!-- Moving Boat with Envoys & Rolled Carpet -->
          <g transform="translate(${boatX}, ${255 + boatBob})">
            <!-- Oarsman -->
            <circle cx="45" cy="8" r="7" fill="#cbd5e1"/>
            <rect x="38" y="15" width="14" height="28" fill="#334155"/>
            <!-- Envoy Holding Rolled Royal Carpet -->
            <circle cx="95" cy="4" r="8" fill="#fde68a"/>
            <rect x="86" y="12" width="18" height="32" fill="#7f1d1d" stroke="#fbbf24"/>
            <!-- Rolled Red-Gold Carpet in Hands -->
            <rect x="98" y="18" width="48" height="12" rx="4" fill="#991b1b" stroke="#fde047" stroke-width="2"/>
            <!-- Boat Hull -->
            <path d="M 10 38 Q 85 58 165 35 Q 185 22 195 5 Q 180 48 155 58 L 28 58 Z" fill="#27170c" stroke="#d97706" stroke-width="2"/>
            <!-- Glowing Torch on Boat Bow -->
            <circle cx="185" cy="2" r="${14 + Math.sin(animFrame * 0.4) * 4}" fill="rgba(255,140,0,0.65)"/>
            <circle cx="185" cy="2" r="4" fill="#fff"/>
            <!-- Rowing Oar -->
            <line x1="48" y1="28" x2="${35 + oarAngle * 0.5}" y2="68" stroke="#b45309" stroke-width="4"/>
          </g>
        </svg>`;
    } else {
      fxLayer.innerHTML = `
        <svg viewBox="0 0 800 450" class="w-full h-full">
          <!-- Courtyard Floor -->
          <rect x="0" y="310" width="800" height="140" fill="rgba(24, 10, 5, 0.85)" stroke="#b45309"/>
          <!-- Left Envoys Presenting Unrolling Carpet -->
          <g transform="translate(190, 215)">
            <circle cx="0" cy="0" r="14" fill="#fde68a"/>
            <rect x="-16" y="15" width="32" height="85" fill="#7f1d1d" stroke="#fbbf24" stroke-width="2"/>
            <!-- Unrolling Royal Carpet -->
            <rect x="18" y="38" width="${carpetLen}" height="18" rx="5" fill="#991b1b" stroke="#fde047" stroke-width="2.5"/>
          </g>
          <!-- Right Fortress King & Guards Bowing in Welcome -->
          <g transform="translate(540, 215)">
            <g transform="rotate(${bowAngle} 0 60)">
              <circle cx="0" cy="-5" r="15" fill="#fde68a"/>
              <path d="M -16 -12 Q 0 -32 16 -12 Z" fill="#fbbf24"/>
              <rect x="-18" y="12" width="36" height="88" fill="#991b1b" stroke="#fbbf24" stroke-width="2"/>
              <line x1="-15" y1="30" x2="-55" y2="15" stroke="#991b1b" stroke-width="8"/>
            </g>
          </g>
        </svg>`;
    }
    requestAnimationFrame(renderLiveVectorAnimation);
  }

  function renderUI() {
    const s = scenes[activeIndex];
    if (!s) return;
    document.getElementById('preview-era').innerText = s.era || '';
    const titleEl = document.getElementById('preview-title');
    titleEl.innerText = s.title || '';
    titleEl.style.textShadow = `0 0 40px ${s.themeColor || '#ff3300'}, 0 6px 20px #000`;

    document.getElementById('preview-sub').innerText = s.subtitle || '';
    document.getElementById('preview-sub-box').style.borderColor = s.themeColor || '#ff3300';
    document.getElementById('preview-img').src = s.imageUrl || '';
    document.getElementById('scene-counter').innerText = `Part ${activeIndex + 1} of ${scenes.length}`;

    document.getElementById('inp-era').value = s.era || '';
    document.getElementById('inp-title').value = s.title || '';
    document.getElementById('inp-sub').value = s.subtitle || '';
    document.getElementById('inp-img').value = s.imageUrl || '';
    document.getElementById('inp-fx').value = s.fxType || 'slow-push';
    document.getElementById('inp-dur').value = s.durationSec || 5;
    document.getElementById('inp-color').value = s.themeColor || '#f59e0b';

    const tracks = document.getElementById('timeline-tracks');
    tracks.innerHTML = scenes.map((item, idx) => `
      <button onclick="selectScene(${idx})" class="flex-shrink-0 px-3 py-2 rounded-lg border text-left transition ${idx === activeIndex ? 'bg-red-950/60 border-red-500 text-white' : 'bg-zinc-950 border-zinc-800 text-zinc-400'}">
        <div class="text-[10px] font-mono text-amber-400">${item.partId || 'PART ' + (idx + 1)} (${item.durationSec}s)</div>
        <div class="text-xs font-bold truncate max-w-[140px]">${item.title}</div>
      </button>
    `).join('');
  }

  function applyPastedCode() {
    try {
      const raw = document.getElementById('json-box').value;
      const parsed = parseCommentedJSON(raw);
      if (Array.isArray(parsed) && parsed.length > 0) {
        scenes = parsed;
        activeIndex = 0;
        renderUI();
      }
    } catch (e) {
      alert("JSON check karo: Make sure '[' se shuru ho aur ']' par khatam ho!");
    }
  }

  function selectScene(idx) { activeIndex = idx; renderUI(); }
  function triggerSlashFX() { activeIndex = (activeIndex + 1) % scenes.length; renderUI(); }

  function updateCurrentScene() {
    const s = scenes[activeIndex];
    s.era = document.getElementById('inp-era').value;
    s.title = document.getElementById('inp-title').value;
    s.subtitle = document.getElementById('inp-sub').value;
    s.imageUrl = document.getElementById('inp-img').value;
    s.fxType = document.getElementById('inp-fx').value;
    s.durationSec = Number(document.getElementById('inp-dur').value) || 5;
    s.themeColor = document.getElementById('inp-color').value;
    document.getElementById('json-box').value = JSON.stringify(scenes, null, 2);
    renderUI();
  }

  function addNewScene() {
    scenes.push({
      partId: `PART_${scenes.length + 1}_CUSTOM`,
      sceneType: "medieval-river-boat",
      era: "KASHMIR • 958 AD",
      title: "NEW MEDIEVAL PART",
      subtitle: "Naye hisse ki kahani yahan likho...",
      imageUrl: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1920&q=85",
      durationSec: 5,
      fxType: "slow-push",
      themeColor: "#f59e0b"
    });
    activeIndex = scenes.length - 1;
    renderUI();
  }

  function deleteCurrentScene() {
    if (scenes.length <= 1) return;
    scenes.splice(activeIndex, 1);
    activeIndex = Math.max(0, activeIndex - 1);
    renderUI();
  }

  function togglePlay() {
    const btn = document.getElementById('play-btn');
    if (isPlaying) {
      isPlaying = false; clearTimeout(playTimer); btn.innerText = "▶ Play All"; return;
    }
    isPlaying = true; btn.innerText = "⏸ Pause"; playStep();
  }

  function playStep() {
    if (!isPlaying) return;
    renderUI();
    playTimer = setTimeout(() => {
      if (!isPlaying) return;
      activeIndex = (activeIndex + 1) % scenes.length;
      playStep();
    }, (scenes[activeIndex].durationSec || 5) * 1000);
  }

  function copyAndOpenActions() {
    const cleanJson = JSON.stringify(scenes);
    navigator.clipboard.writeText(cleanJson);
    alert("✅ Clean JSON Copy ho gaya! Ab GitHub Actions ke box mein Paste kar do!");
  }

  // Initialize with commented JSON
  document.getElementById('json-box').value = DEFAULT_RAW_JSON;
  scenes = parseCommentedJSON(DEFAULT_RAW_JSON);
  renderUI();
  requestAnimationFrame(renderLiveVectorAnimation);
</script>
</body>
</html>
